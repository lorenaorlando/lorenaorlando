<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Modak&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --morado:#360185; --violeta:#8F0177; --magenta:#DE1A58; --mostaza:#F4B342; --crema:#FFF0D6; --fondo:#8441b7;
    --display:"Modak",cursive;
    --shadow: .25vw .35vw .7vw rgba(54,1,133,.85);          /* drop shadow morado, para todos los textos */
    --shadow-sm: .12vw .18vw .35vw rgba(54,1,133,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--fondo);overscroll-behavior:none}
  body{font-family:"Instrument Serif",Georgia,serif;letter-spacing:-.084em;color:var(--crema)}
  .stage{position:fixed;inset:0;overflow:hidden;background:var(--fondo);touch-action:none}
  .layer{position:absolute;inset:0;will-change:transform;pointer-events:none}

  /* Nubes de fondo: fijas */
  #clouds{position:absolute;inset:0;z-index:0;pointer-events:none}
  #clouds img{position:absolute;height:auto;user-select:none;-webkit-user-drag:none;animation:float 10s ease-in-out infinite}
  @keyframes float{0%,100%{translate:0 0}50%{translate:var(--dx,1vw) var(--dy,-1.5vh)}}

  /* 3D: solo escala */
  .model-wrap{position:absolute;left:50%;top:50%;width:70vw;height:120vh;transform:translate(-50%,-50%);will-change:transform;z-index:2}
  model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}

  /* HERO */
  .hero{z-index:3;transform-origin:50% 100%}
  .hola{position:absolute;left:10.5vw;top:13vh;font-size:15vw;line-height:1;font-weight:400;transform:rotate(-13deg);transform-origin:left bottom;text-shadow:var(--shadow)}
  .soy{position:absolute;left:16.5vw;top:30vh;font-size:10vw;line-height:1;font-weight:400;transform:rotate(10deg);text-shadow:var(--shadow)}
  .lorena{position:absolute;left:0;right:0;top:47vh;text-align:center;font-family:var(--display);font-weight:400;font-size:24vw;line-height:1;letter-spacing:-.02em;text-shadow:var(--shadow);white-space:nowrap}
  .cosas{position:absolute;right:2vw;top:38vh;font-size:4vw;line-height:1;text-shadow:var(--shadow-sm)}
  .lang{position:absolute;right:4vw;top:7vh;display:flex;flex-direction:column;gap:1.6vh;pointer-events:auto;z-index:6}
  .lang button{all:unset;cursor:pointer;font-size:2.8vw;line-height:1;display:flex;align-items:center;gap:.3vw;color:var(--crema);text-shadow:var(--shadow-sm)}
  .lang button:focus-visible{outline:2px solid var(--crema);outline-offset:4px}
  .lang button[aria-pressed="false"]{opacity:.6}
  .lang .f{font-size:2.4vw;letter-spacing:0;text-shadow:none}

  /* SECCIÓN 2 */
  .about{z-index:3;transform-origin:50% 0}
  .titles{position:absolute;top:0;bottom:0;left:46vw;right:3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh}
  .word{pointer-events:auto;cursor:default;display:flex;align-items:center;gap:1vw;font-family:var(--display);font-size:6.4vw;line-height:1;letter-spacing:.02em;white-space:nowrap;text-shadow:var(--shadow)}
  /* 3D pequeño al lado de cada título */
  .word .ico{width:1.15em;height:1.15em;flex:none;pointer-events:none;--poster-color:transparent;background:transparent}
  .word:hover{animation:pulse .9s ease-in-out infinite}
  @keyframes pulse{0%,100%{scale:1}50%{scale:1.09}}
  @media (prefers-reduced-motion:reduce){#clouds img,.word:hover{animation:none}}
  .w1{rotate:-3deg}.w2{rotate:1.5deg}.w3{rotate:-2deg}.w4{rotate:2.5deg}.w5{rotate:-1.5deg}.w6{rotate:2deg}

  #status{position:absolute;left:2vw;bottom:2vh;z-index:9;font:14px/1.3 system-ui,sans-serif;letter-spacing:0;color:var(--crema);background:var(--morado);padding:8px 12px;border-radius:8px;max-width:80vw}

  @media (max-width:700px){
    .model-wrap{width:110vw;height:62vh;top:47%}
    .hola{font-size:28vw;left:6vw;top:7vh}
    .soy{font-size:17vw;left:12vw;top:20vh}
    .lorena{font-size:30vw;top:56vh}
    .cosas{font-size:7vw;top:70vh;right:auto;left:0;width:100%;text-align:center}
    .lang button{font-size:5vw}.lang .f{font-size:4.5vw}
    .titles{left:0;right:0;top:38vh}
    .word{font-size:10vw}
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div id="clouds" aria-hidden="true"></div>

  <div class="layer hero" id="hero">
    <h1 class="hola" data-es="hola!" data-en="hi!">hola!</h1>
    <p class="soy" data-es="soy" data-en="i'm">soy</p>
    <nav class="lang" aria-label="Idioma">
      <button type="button" data-lang="en" aria-pressed="false"><span class="f">🇺🇸</span>eng</button>
      <button type="button" data-lang="es" aria-pressed="true"><span class="f">🇪🇸</span>esp</button>
    </nav>
    <p class="cosas" data-es="y hago muuuchas cosas..." data-en="and I do sooo many things...">y hago muuuchas cosas...</p>
  </div>

  <div class="model-wrap" id="model">
    <model-viewer
      id="mv"
      alt="Lorena asomándose sobre una isla flotante"
      camera-controls
      disable-zoom
      disable-pan
      interaction-prompt="none"
      shadow-intensity="0"
      exposure="1.1"
      camera-orbit="0deg 82deg auto"
      auto-rotate
      auto-rotate-delay="800"
      rotation-per-second="36deg"
      min-camera-orbit="auto 60deg auto"
      max-camera-orbit="auto 100deg auto"
      min-field-of-view="20deg"
      max-field-of-view="40deg"
      loading="eager"
      reveal="auto"></model-viewer>
  </div>

  <!-- "Lorena" va por delante del 3D -->
  <div class="layer hero" id="heroTitle" style="z-index:4">
    <h2 class="lorena" data-es="Lorena" data-en="Lorena">Lorena</h2>
  </div>

  <div class="layer about" id="about">
    <div class="titles">
      <div class="word w1"><span data-es="música" data-en="music">música</span><model-viewer class="ico" data-model="FUNMACHINE_EXP.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
      <div class="word w2"><span data-es="fotografía" data-en="photography">fotografía</span><model-viewer class="ico" data-model="ZENIT.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
      <div class="word w3"><span data-es="escritura" data-en="writing">escritura</span><model-viewer class="ico" data-model="LAPI_EXP.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
      <div class="word w4"><span data-es="net art & 3d" data-en="net art & 3d">net art &amp; 3d</span><model-viewer class="ico" data-model="LOGO_COMP.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
      <div class="word w5"><span data-es="diseño web" data-en="web design">diseño web</span><model-viewer class="ico" data-model="COMPU_VIEJA.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
      <div class="word w6"><span data-es="magick" data-en="magick">magick</span><model-viewer class="ico" data-model="TAROT_EXP.glb" alt="" aria-hidden="true" auto-rotate auto-rotate-delay="0" rotation-per-second="30deg" interaction-prompt="none" disable-zoom loading="eager" shadow-intensity="0"></model-viewer></div>
    </div>
  </div>

  <p id="status" hidden></p>

</div>

<script>
(function(){
  /* ---------- ASSETS ----------
     Primero busca en la carpeta ./assets/ (modo local).
     Si no los encuentra, usa los de tu hosting. */
  var LOCAL  = 'assets/';
  var REMOTE = 'https://lorenalandia.fun/wp-content/uploads/2026/10/';
  var CLOUD_FILES = ['1.png','2.png','4.png','5.png','6.png'];

  // Modelo 3D
  var mv = document.getElementById('mv');
  var triedRemote = false;
  var status = document.getElementById('status');
  mv.addEventListener('error', function(e){
    console.error('model-viewer error:', e.detail, 'src:', mv.getAttribute('src'));
    if (!triedRemote) { triedRemote = true; mv.setAttribute('src', REMOTE + 'HEAD_EXP.glb'); return; }
    status.hidden = false;
    status.textContent = 'No se pudo cargar el modelo 3D. Abre la consola (F12) para ver el motivo.';
  });
  mv.addEventListener('load', function(){ status.hidden = true; console.log('GLB cargado:', mv.getAttribute('src')); });
  mv.setAttribute('src', LOCAL + 'HEAD_EXP.glb');

  // 3D pequeños de cada título (si falta el archivo, se oculta sin mover el título)
  var icos = document.querySelectorAll('.ico'), pending = icos.length;
  icos.forEach(function(ico){
    ico.addEventListener('error', function(){ ico.style.visibility = 'hidden'; icoDone(); });
    ico.addEventListener('load', icoDone);
    ico.setAttribute('src', LOCAL + ico.dataset.model);
  });
  function icoDone(){ if (--pending <= 0) setTimeout(endWarm, 600); }

  // Nubes de fondo: cuadrícula con posiciones aleatorias (semilla fija = siempre igual)
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var seed2 = 11;
  function rnd2(){ seed2 = (seed2 * 16807) % 2147483647; return (seed2 - 1) / 2147483646; }
  var wrap = document.getElementById('clouds');
  var COLS = 5, ROWS = 3, TOTAL = 14, n = 0;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (n >= TOTAL) break;
      var img = new Image();
      var f = CLOUD_FILES[n % CLOUD_FILES.length]; n++;
      var w = 13 + rnd() * 13;                              // vw
      img.alt = '';
      img.style.width = w + 'vw';
      img.style.left = ((c + rnd() * .8) / COLS * 100 - 5) + 'vw';
      img.style.top  = ((r + rnd() * .8) / ROWS * 100 - 6) + 'vh';
      img.style.transform = 'rotate(' + (rnd() * 16 - 8) + 'deg)' + (rnd() > .5 ? ' scaleX(-1)' : '');
      img.style.opacity = (.85 + rnd() * .15).toFixed(2);
      // flotar (PRNG aparte para no mover las posiciones de las nubes)
      img.style.setProperty('--dx', ((rnd2() * 2 - 1) * 1.6).toFixed(2) + 'vw');
      img.style.setProperty('--dy', ((rnd2() * 2 - 1) * 2.6).toFixed(2) + 'vh');
      img.style.animationDuration = (8 + rnd2() * 8).toFixed(1) + 's';
      img.style.animationDelay = '-' + (rnd2() * 12).toFixed(1) + 's';
      img.onerror = function(){ this.onerror = null; this.src = REMOTE + this.dataset.f; };  // sin copia local → hosting
      img.dataset.f = f;
      img.src = LOCAL + f;
      wrap.appendChild(img);
    }
  }

  /* ---------- ANIMACIÓN ---------- */
  var hero = document.getElementById('hero');
  var title = document.getElementById('heroTitle');
  var about = document.getElementById('about');
  var model = document.getElementById('model');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = 0, current = 0, from = 0, t0 = 0;
  var DURATION = 1100;                               // ms por transición, sin importar los fps
  /* Calentamiento: los 3D de la pantalla 2 se dibujan una vez, invisibles, mientras se ve la 1ª.
     Así el navegador prepara sus gráficos antes y la entrada no se traba. */
  var warming = true;
  about.style.opacity = '0';
  function endWarm(){ if (!warming) return; warming = false; about.style.opacity = ''; last = -1; }
  setTimeout(endWarm, 8000);
  var SCALE_END = 0.65, SHIFT_X = -27, SHIFT_Y = 2;

  function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
  function render(p){
    var e = ease(p);
    var up = -e * 115, rot = -e * 5;                 // los textos suben y giran un poco, como en una rueda
    hero.style.transform  = 'translateY(' + up + 'vh) rotate(' + rot + 'deg)';
    title.style.transform = 'translateY(' + up + 'vh) rotate(' + rot + 'deg)';
    about.style.transform = warming && p === 0 ? 'none'
      : 'translateY(' + ((1 - e) * 100) + 'vh) rotate(' + ((1 - e) * 5) + 'deg)';
    var m = window.innerWidth <= 700;
    var sEnd = m ? 0.5 : SCALE_END, xEnd = m ? 0 : SHIFT_X, yEnd = m ? -24 : SHIFT_Y;
    var s = 1 - (1 - sEnd) * e;
    model.style.transform = 'translate(-50%,-50%) translate(' + (xEnd * e) + 'vw,' + (yEnd * e) + 'vh) scale(' + s + ')';
  }
  var last = -1;
  function tick(){
    var k = reduce ? 1 : Math.min(1, (performance.now() - t0) / DURATION);
    current = from + (target - from) * k;
    if (current !== last) { render(current); last = current; }
    requestAnimationFrame(tick);
  }
  function go(v){
    if (v === 1) endWarm();
    if (v !== target) { from = current; target = v; t0 = performance.now(); }
    // solo la pantalla visible es enfocable/clicable (eng/esp no se alcanza con Tab en la 2ª)
    hero.inert = title.inert = v === 1;
    about.inert = v === 0;
  }
  window.addEventListener('resize', function(){ last = -1; });

  // rueda / trackpad
  window.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) < 4) return;
    go(e.deltaY > 0 ? 1 : 0);
  }, {passive:true});
  // táctil (deslizar)
  var x0 = null, y0 = null;
  window.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchend', function(e){
    if (y0 === null) return;
    var dx = x0 - e.changedTouches[0].clientX, dy = y0 - e.changedTouches[0].clientY;
    // solo gestos verticales: arrastrar en horizontal para girar la cabeza no cambia de pantalla
    if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) go(dy > 0 ? 1 : 0);
    x0 = y0 = null;
  }, {passive:true});
  // teclado
  window.addEventListener('keydown', function(e){
    if (e.key === ' ' && e.target.closest && e.target.closest('button')) return;  // espacio activa eng/esp
    if (['ArrowDown','PageDown',' ','End'].indexOf(e.key) > -1) { go(1); e.preventDefault(); }
    if (['ArrowUp','PageUp','Home'].indexOf(e.key) > -1) { go(0); e.preventDefault(); }
  });

  if (reduce) document.querySelectorAll('model-viewer').forEach(function(m){ m.removeAttribute('auto-rotate'); });
  go(0); tick();

  /* ---------- IDIOMA ---------- */
  var buttons = document.querySelectorAll('[data-lang]');
  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-es]').forEach(function(el){ el.textContent = el.getAttribute('data-' + l); });
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false'); });
  }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });
})();
</script>
</body>
</html>

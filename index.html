<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Modak&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --morado:#360185; --violeta:#8F0177; --magenta:#DE1A58; --mostaza:#F4B342; --crema:#FFF0D6; --fondo:#8441b7;
    --display:"Modak",cursive;
    --shadow: .25vw .35vw .7vw rgba(54,1,133,.85);          /* drop shadow morado, para todos los textos */
    --shadow-sm: .12vw .18vw .35vw rgba(54,1,133,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--fondo);overscroll-behavior:none}
  body{font-family:"Instrument Serif",Georgia,serif;letter-spacing:-.084em;color:var(--crema)}
  .stage{position:fixed;inset:0;overflow:hidden;overflow:clip;background:var(--fondo);touch-action:none}
  .layer{position:absolute;inset:0;will-change:transform;pointer-events:none}

  /* Nubes de fondo: fijas */
  #clouds{position:absolute;inset:0;z-index:0;pointer-events:none}
  #clouds img{position:absolute;height:auto;user-select:none;-webkit-user-drag:none;animation:float 10s ease-in-out infinite}
  @keyframes float{0%,100%{translate:0 0}50%{translate:var(--dx,1vw) var(--dy,-1.5vh)}}

  /* 3D: solo escala */
  .model-wrap{position:absolute;left:50%;top:50%;width:70vw;height:120vh;transform:translate(-50%,-50%);will-change:transform;z-index:2}
  model-viewer{width:100%;height:100%;--poster-color:transparent;background:transparent}

  /* HERO */
  .hero{z-index:3;transform-origin:50% 100%}
  .hola{position:absolute;left:10.5vw;top:13vh;font-size:15vw;line-height:1;font-weight:400;transform:rotate(-13deg);transform-origin:left bottom;text-shadow:var(--shadow)}
  .soy{position:absolute;left:16.5vw;top:30vh;font-size:10vw;line-height:1;font-weight:400;transform:rotate(10deg);text-shadow:var(--shadow)}
  .lorena{position:absolute;left:0;right:0;top:47vh;text-align:center;font-family:var(--display);font-weight:400;font-size:24vw;line-height:1;letter-spacing:-.02em;text-shadow:var(--shadow);white-space:nowrap}
  .cosas{position:absolute;right:2vw;top:38vh;font-size:4vw;line-height:1;text-shadow:var(--shadow-sm)}
  .lang{position:absolute;right:4vw;top:7vh;display:flex;flex-direction:column;gap:1.6vh;pointer-events:auto;z-index:6}
  .lang button{all:unset;cursor:pointer;font-size:2.8vw;line-height:1;display:flex;align-items:center;gap:.3vw;color:var(--crema);text-shadow:var(--shadow-sm)}
  .lang button:focus-visible{outline:2px solid var(--crema);outline-offset:4px}
  .lang button[aria-pressed="false"]{opacity:.6}
  .lang .f{font-size:2.4vw;letter-spacing:0;text-shadow:none}

  /* SECCIÓN 2 */
  .about{z-index:3;transform-origin:50% 0}
  .titles{position:absolute;top:0;bottom:0;left:46vw;right:3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh}
  .word{pointer-events:auto;cursor:default;font-family:var(--display);font-size:7vw;line-height:1;letter-spacing:.02em;white-space:nowrap;text-shadow:var(--shadow)}
  .word:hover{animation:pulse .9s ease-in-out infinite}
  button.word{background:none;border:0;padding:0;color:inherit;font-weight:400;cursor:pointer}
  button.word:focus-visible{outline:2px solid var(--crema);outline-offset:4px}
  @keyframes pulse{0%,100%{scale:1}50%{scale:1.09}}
  @media (prefers-reduced-motion:reduce){#clouds img,.word:hover{animation:none}}
  .w1{rotate:-3deg}.w2{rotate:1.5deg}.w3{rotate:-2deg}.w4{rotate:2.5deg}.w5{rotate:-1.5deg}.w6{rotate:2deg}

  /* SECCIÓN 3: MÚSICA */
  .music{z-index:3;transform-origin:50% 0}
  .music .t{position:absolute;text-align:center;line-height:.95;white-space:pre-line;text-shadow:var(--shadow-sm);transform:translate(-50%,-50%)}
  .historia{left:43vw;top:23vh;font-size:2.4vw;rotate:6deg}
  .otros{left:49.5vw;top:66vh;font-size:2.4vw;rotate:-7deg}
  .escucha{left:47.7vw;top:81.5vh;font-size:2vw}
  .organ{position:absolute;left:47.4vw;top:44vh;width:29vw;height:55vh;transform:translate(-50%,-50%)}
  .music .mtitle{left:48vw;top:46vh;font-family:var(--display);font-weight:400;font-size:7vw;line-height:1;letter-spacing:.02em;rotate:-7deg;text-shadow:var(--shadow)}

  /* Portadas: centro (--x vw, --y vh), lado (--s), giro (--r); --dir = hacia dónde sale el LP */
  .discs{position:absolute;inset:0}
  .disc{all:unset;box-sizing:border-box;position:absolute;--u:min(1vw,1.78vh);width:calc(var(--s) * var(--u));aspect-ratio:1;left:calc(var(--x) * 1vw - var(--s) * var(--u) / 2);top:calc(var(--y) * 1vh - var(--s) * var(--u) / 2);rotate:var(--r);z-index:var(--z);pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .disc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;box-shadow:.3vw .5vw 1.2vw rgba(54,1,133,.45)}
  .disc:hover,.disc:focus-visible{z-index:30}
  .disc:focus-visible img{outline:3px solid var(--crema);outline-offset:3px}
  .disc:hover .lp,.disc:focus-visible .lp{translate:calc(var(--dir) * 46%) 0;animation-play-state:running}
  .name{position:absolute;left:50%;bottom:7%;translate:-50% 0;width:max-content;max-width:88%;padding:.2em .55em .3em;background:var(--morado);color:var(--crema);font-size:1.5vw;line-height:1.05;text-align:center;border-radius:.3em;box-shadow:var(--shadow-sm);opacity:0;transform:translateY(.4vw);transition:opacity .25s,transform .25s}
  .disc:hover .name,.disc:focus-visible .name{opacity:1;transform:none}

  /* LP: surcos + etiqueta con la portada */
  .lp{position:absolute;inset:4%;border-radius:50%;background:conic-gradient(from 20deg,transparent,rgba(255,255,255,.13) 8%,transparent 18%,transparent 50%,rgba(255,255,255,.13) 58%,transparent 68%),repeating-radial-gradient(circle,#141414 0 2px,#262626 2.5px,#141414 3.5px);box-shadow:0 0 1vw rgba(0,0,0,.35);transition:translate .7s cubic-bezier(.2,.8,.2,1);animation:spin 3.2s linear infinite paused}
  .lp i{position:absolute;inset:33%;border-radius:50%;background:center/cover var(--morado)}
  .lp i::after{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--fondo)}
  @keyframes spin{to{rotate:360deg}}

  .listen{position:absolute;left:47.7vw;top:88.8vh;transform:translate(-50%,-50%);width:17vw;height:8.7vh;display:flex;align-items:center;justify-content:space-evenly;background:var(--crema);border-radius:.5vw;box-shadow:.25vw .35vw .7vw rgba(54,1,133,.5);pointer-events:auto}
  .listen a{display:block;width:2.6vw;height:2.6vw;color:var(--morado);--i2:var(--crema);transition:scale .2s,color .2s}
  .listen a:hover,.listen a:focus-visible{color:var(--magenta);scale:1.15;outline:none}
  .listen svg,.pf svg{display:block;width:100%;height:100%}

  /* FICHA DEL DISCO */
  .album{z-index:5;transform-origin:50% 0}
  .back{all:unset;position:absolute;left:3vw;top:4vh;z-index:2;font-size:2vw;line-height:1;cursor:pointer;pointer-events:auto;text-shadow:var(--shadow-sm);transition:color .2s}
  .back:hover{color:var(--mostaza)}
  .back:focus-visible,.pf:focus-visible{outline:2px solid var(--crema);outline-offset:4px}
  .album-in{position:absolute;inset:0;display:flex;align-items:center;gap:14vw;padding:5vh 6vw 5vh 7vw}
  .album-art{position:relative;flex:none;width:min(34vw,64vh);aspect-ratio:1}
  .album-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;box-shadow:.4vw .6vw 1.6vw rgba(54,1,133,.5)}
  .album-art .lp{transition:translate 1s cubic-bezier(.2,.8,.2,1);animation:spin 6s linear infinite}
  .album.open .album-art .lp{translate:32% 0}
  .album-info{flex:1 1 auto;min-width:0;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;pointer-events:auto;padding:1vh 1.5vw 1vh 0;scrollbar-width:thin;scrollbar-color:rgba(255,240,214,.5) transparent}
  .album-title{font-family:var(--display);font-weight:400;font-size:4.8vw;line-height:.95;letter-spacing:.02em;text-transform:uppercase;text-shadow:var(--shadow)}
  .album-title.long{font-size:3.1vw}
  .album-meta{margin-top:1.4vh;font-size:2.2vw;line-height:1.1;text-shadow:var(--shadow-sm)}
  .album-meta b{font-weight:400;color:var(--mostaza)}
  .album-text{margin-top:2.4vh}
  .album-text p,.album-credits p{font-size:1.45vw;line-height:1.3;text-shadow:var(--shadow-sm)}
  .album-text p+p{margin-top:1.2vh}
  .album-text a,.album-credits a{color:var(--mostaza);pointer-events:auto}
  .album-credits{margin-top:2.6vh}
  .album-credits p{font-size:1.25vw;opacity:.92}
  .album-credits p+p{margin-top:.4vh}
  .album-credits .lbl{font-size:2.2vw;line-height:1.1;color:var(--mostaza);text-shadow:var(--shadow-sm);margin-bottom:.6vh}
  .listen-lbl{margin-top:3.2vh;font-size:2.8vw;line-height:1;text-shadow:var(--shadow-sm)}
  .platforms{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1vw;max-width:31vw;margin-top:1.6vh}
  .pf{display:flex;align-items:center;gap:.8vw;padding:.65vw 1.2vw .65vw .7vw;background:var(--crema);color:var(--morado);--i2:var(--crema);border-radius:999px;text-decoration:none;font-size:1.55vw;line-height:1;box-shadow:var(--shadow-sm);transition:background .2s,translate .2s}
  .pf svg{flex:none;width:2.3vw;height:2.3vw}
  .pf:hover,.pf:focus-visible{background:var(--mostaza);--i2:var(--mostaza);translate:0 -.2vw}
  @media (prefers-reduced-motion:reduce){.lp{animation:none!important;transition:none!important}}

  #status{position:absolute;left:2vw;bottom:2vh;z-index:9;font:14px/1.3 system-ui,sans-serif;letter-spacing:0;color:var(--crema);background:var(--morado);padding:8px 12px;border-radius:8px;max-width:80vw}

  @media (max-width:700px){
    .model-wrap{width:110vw;height:62vh;top:47%}
    .hola{font-size:28vw;left:6vw;top:7vh}
    .soy{font-size:17vw;left:12vw;top:20vh}
    .lorena{font-size:30vw;top:56vh}
    .cosas{font-size:7vw;top:70vh;right:auto;left:0;width:100%;text-align:center}
    .lang button{font-size:5vw}.lang .f{font-size:4.5vw}
    .titles{left:0;right:0;top:38vh}
    .word{font-size:12vw}
    .historia{left:50vw;top:7vh;font-size:4.4vw;rotate:3deg}
    .organ{left:50vw;top:19.5vh;width:72vw;height:27vh}
    .music .mtitle{left:50vw;top:23vh;font-size:17vw}
    .otros{left:50vw;top:33vh;font-size:4.4vw;rotate:-3deg}
    .discs{inset:auto 0;top:39.5vh;display:grid;grid-template-columns:repeat(3,min(27vw,13.3vh));gap:min(3vw,1.6vh);justify-content:center}
    .disc{position:relative;left:auto;top:auto;width:auto;rotate:calc(var(--r) * .4)}
    .name{font-size:3.4vw}
    .escucha{left:50vw;top:84vh;font-size:4.2vw}
    .listen{left:50vw;top:91vh;width:62vw;height:7.5vh;border-radius:1.5vw}
    .listen a{width:8vw;height:8vw}
    .back{left:5vw;top:2.5vh;font-size:5.5vw;padding:.2em .6em .3em;background:var(--morado);border-radius:999px}
    .album-in{display:block;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;pointer-events:auto;padding:11vh 7vw 7vh}
    .album-art{width:min(62vw,40vh);margin:0 0 4vh 4vw}
    .album-info{max-height:none;overflow:visible;padding:0}
    .album-title{font-size:11vw}.album-title.long{font-size:7.5vw}
    .album-meta{font-size:5vw}
    .album-text p{font-size:4.4vw}
    .album-credits p{font-size:4vw}
    .album-credits .lbl{font-size:5vw}
    .listen-lbl{margin-top:4vh;font-size:6.5vw}
    .platforms{max-width:none;gap:2.5vw;margin-top:2vh}
    .pf{gap:2vw;padding:2vw 3vw 2vw 2vw;font-size:4.4vw}
    .pf svg{width:6.5vw;height:6.5vw}
  }
</style>
</head>

<div class="stage" id="stage">

  <div class="layer hero" id="hero">

    </nav>

la música</p>

arte sonoro</p>

      <a href="https://open.spotify.com/artist/4CQeBhnbUpLbhZ6DbEo6rg" target="_blank" rel="noopener" aria-label="Spotify"><svg><use href="#i-spotify"/></svg></a>

  <section class="layer album" id="album" aria-labelledby="albumTitle">

<script>
(function(){
  /* ---------- ASSETS ----------
     Primero busca en la carpeta ./assets/ (modo local).
     Si no los encuentra, usa los de tu hosting. */
  var LOCAL  = 'assets/';
  var REMOTE = 'https://lorenalandia.fun/wp-content/uploads/2026/10/';
  var CLOUD_FILES = ['1.png','2.png','4.png','5.png','6.png'];

  // Modelo 3D
  var mv = document.getElementById('mv');
  var triedRemote = false;
  var status = document.getElementById('status');
  mv.addEventListener('error', function(e){
    console.error('model-viewer error:', e.detail, 'src:', mv.getAttribute('src'));
    if (!triedRemote) { triedRemote = true; mv.setAttribute('src', REMOTE + 'HEAD_EXP.glb'); return; }
    status.hidden = false;
    status.textContent = 'No se pudo cargar el modelo 3D. Abre la consola (F12) para ver el motivo.';
  });
  mv.addEventListener('load', function(){ status.hidden = true; console.log('GLB cargado:', mv.getAttribute('src')); });
  mv.setAttribute('src', LOCAL + 'HEAD_EXP.glb');


  // Nubes de fondo: cuadrícula con posiciones aleatorias (semilla fija = siempre igual)
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var seed2 = 11;
  function rnd2(){ seed2 = (seed2 * 16807) % 2147483647; return (seed2 - 1) / 2147483646; }
  var wrap = document.getElementById('clouds');
  var COLS = 5, ROWS = 3, TOTAL = 14, n = 0;
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (n >= TOTAL) break;
      var img = new Image();
      var f = CLOUD_FILES[n % CLOUD_FILES.length]; n++;
      var w = 13 + rnd() * 13;                              // vw
      img.alt = '';
      img.style.width = w + 'vw';
      img.style.left = ((c + rnd() * .8) / COLS * 100 - 5) + 'vw';
      img.style.top  = ((r + rnd() * .8) / ROWS * 100 - 6) + 'vh';
      img.style.transform = 'rotate(' + (rnd() * 16 - 8) + 'deg)' + (rnd() > .5 ? ' scaleX(-1)' : '');
      img.style.opacity = (.85 + rnd() * .15).toFixed(2);
      // flotar (PRNG aparte para no mover las posiciones de las nubes)
      img.style.setProperty('--dx', ((rnd2() * 2 - 1) * 1.6).toFixed(2) + 'vw');
      img.style.setProperty('--dy', ((rnd2() * 2 - 1) * 2.6).toFixed(2) + 'vh');
      img.style.animationDuration = (8 + rnd2() * 8).toFixed(1) + 's';

      img.onerror = function(){ this.onerror = null; this.src = REMOTE + this.dataset.f; };  // sin copia local → hosting
      img.dataset.f = f;
      img.src = LOCAL + f;
      wrap.appendChild(img);
    }
  }

  ];
  var TYPES = {album:{es:'álbum',en:'album'}, ep:{es:'EP',en:'EP'}, comp:{es:'recopilación',en:'compilation'}};
  var MONTHS = {es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
                en:['January','February','March','April','May','June','July','August','September','October','November','December']};
  var PLATFORMS = [['spotify','Spotify'],['apple','Apple Music'],['youtube','YouTube Music'],['bandcamp','Bandcamp']];

  function coverImg(img, f, onload){
    img.onerror = function(){ img.onerror = null; img.src = REMOTE + f; };   // sin copia local → hosting
    if (onload) img.addEventListener('load', onload);
    img.src = LOCAL + f;
  }
  var discsWrap = document.getElementById('discs');
  ALBUMS.forEach(function(al, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'disc'; b.setAttribute('aria-label', al.title);
    var p = al.pos;
    b.style.cssText = '--x:' + p[0] + ';--y:' + p[1] + ';--s:' + p[2] + ';--r:' + p[3] + ';--z:' + p[4] + ';--dir:' + p[5];
    b.innerHTML = '<span class="lp"><i></i></span><img alt=""><span class="name"></span>';
    b.querySelector('.name').textContent = al.title;
    var img = b.querySelector('img'), label = b.querySelector('.lp i');
    coverImg(img, al.f, function(){ label.style.backgroundImage = 'url("' + img.src + '")'; });
    b.addEventListener('click', function(){ openAlbum(i, b); });
    discsWrap.appendChild(b);
  });

  /* ---------- ANIMACIÓN ----------
     Pantallas: 0 hola, 1 lista, 2 música, 3 ficha de un disco (solo se llega con click). */
  var hero = document.getElementById('hero');
  var title = document.getElementById('heroTitle');
  var about = document.getElementById('about');
  var music = document.getElementById('music');
  var album = document.getElementById('album');
  var model = document.getElementById('model');
  var organ = document.getElementById('organ');
  var LAYERS = [[hero, 0], [title, 0], [about, 1], [music, 2], [album, 3]];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = 0, current = 0, from = 0, t0 = -1e9;
  var DURATION = 1100;                               // ms por transición, sin importar los fps
  var SCALE_END = 0.65, SHIFT_X = -27, SHIFT_Y = 2;

  function ease(t){ return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  // ruleta: lo que entra viene de abajo girado; lo que sale sube y gira
  function place(d){
    if (d <= -1) return [112, 5];                    // 112 y no 100: con el giro, la esquina izquierda asomaría
    if (d < 0) { var e = ease(1 + d); return [(1 - e) * 112, (1 - e) * 5]; }
    if (d < 1) { var e2 = ease(d); return [-e2 * 115, -e2 * 5]; }
    return [-115, -5];
  }
  function render(p){
    LAYERS.forEach(function(l){
      var t = place(p - l[1]);
      l[0].style.transform = 'translateY(' + t[0] + 'vh) rotate(' + t[1] + 'deg)';
    });
    var e = ease(clamp01(p)), e2 = ease(clamp01(p - 1));   // 0→1: la cabeza se reduce; 1→2: sube con la lista
    var m = window.innerWidth <= 700;
    var sEnd = m ? 0.5 : SCALE_END, xEnd = m ? 0 : SHIFT_X, yEnd = m ? -24 : SHIFT_Y;
    var s = 1 - (1 - sEnd) * e;
    model.style.transform = 'translate(-50%,-50%) translate(' + (xEnd * e) + 'vw,' + (yEnd * e - 115 * e2) + 'vh) scale(' + s + ') rotate(' + (-5 * e2) + 'deg)';
  }
  var last = -1;
  function tick(){
    var k = reduce ? 1 : Math.min(1, (performance.now() - t0) / DURATION);
    current = from + (target - from) * k;
    if (current !== last) { render(current); last = current; }
    requestAnimationFrame(tick);
  }
  function go(v){
    if (v !== target) { from = current; target = v; t0 = performance.now(); }
    // solo la pantalla visible es enfocable/clicable (eng/esp no se alcanza con Tab en las demás)
    LAYERS.forEach(function(l){ l[0].inert = l[1] !== v; });
    album.classList.toggle('open', v === 3);
    // el órgano 3D se carga hasta que hace falta, para no frenar la primera pantalla
    if (v >= 1 && !organ.getAttribute('src')) {
      organ.addEventListener('error', function(){ if (organ.getAttribute('src').indexOf(REMOTE) !== 0) organ.setAttribute('src', REMOTE + 'FUNMACHINE_EXP.glb'); });
      organ.setAttribute('src', LOCAL + 'FUNMACHINE_EXP.glb');
    }
  }
  function step(dir){ if (target !== 3) go(Math.max(0, Math.min(2, target + dir))); }
  function busy(){ return performance.now() - t0 < DURATION; }
  window.addEventListener('resize', function(){ last = -1; });
  // al enfocar con Tab una portada que se sale de la pantalla, el navegador desplazaría el escenario
  var stage = document.getElementById('stage');
  stage.addEventListener('scroll', function(){ stage.scrollTop = stage.scrollLeft = 0; });
  document.getElementById('toMusic').addEventListener('click', function(){ go(2); });

  /* ---------- FICHA DEL DISCO ---------- */
  var opener = null;
  function para(html){ var p = document.createElement('p'); p.innerHTML = html; return p; }
  function openAlbum(i, btn){
    var al = ALBUMS[i], l = document.documentElement.lang === 'en' ? 'en' : 'es';
    opener = btn;
    var img = document.getElementById('albumImg'), label = document.getElementById('albumLabel');
    img.alt = al.title;
    label.style.backgroundImage = '';
    coverImg(img, al.f, function once(){ label.style.backgroundImage = 'url("' + img.src + '")'; img.removeEventListener('load', once); });
    var t = document.getElementById('albumTitle');
    t.textContent = al.title;
    t.classList.toggle('long', al.title.length > 22);
    var meta = '<b>' + TYPES[al.type][l] + '</b>';
    if (al.date) {
      var d = al.date, mo = d[1] ? MONTHS[l][d[1] - 1] : '';
      meta += ' · ' + (!d[0] ? d[2] : l === 'en' ? mo + ' ' + d[0] + ', ' + d[2] : d[0] + ' de ' + mo + ' de ' + d[2]);
    }
    document.getElementById('albumMeta').innerHTML = meta;
    var text = document.getElementById('albumText'); text.textContent = '';
    (al.info ? al.info[l] : []).forEach(function(h){ text.appendChild(para(h)); });
    text.hidden = !al.info;
    var cr = document.getElementById('albumCredits'); cr.textContent = '';
    var lbl = document.createElement('p'); lbl.className = 'lbl'; lbl.textContent = l === 'en' ? 'credits' : 'créditos';
    cr.appendChild(lbl);
    al.credits[l].forEach(function(h){ cr.appendChild(para(h)); });
    var ul = document.getElementById('albumLinks'); ul.textContent = '';
    PLATFORMS.forEach(function(pf){
      var li = document.createElement('li'), a = document.createElement('a');
      a.className = 'pf'; a.href = al.links[pf[0]]; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<svg aria-hidden="true"><use href="#i-' + pf[0] + '"/></svg><span></span>';
      a.lastChild.textContent = pf[1];
      li.appendChild(a); ul.appendChild(li);
    });
    album.querySelector('.album-info').scrollTop = 0;
    album.querySelector('.album-in').scrollTop = 0;
    go(3);
    document.getElementById('back').focus({preventScroll:true});
  }
  function closeAlbum(){
    go(2);
    if (opener) opener.focus({preventScroll:true});
  }
  document.getElementById('back').addEventListener('click', closeAlbum);

  // rueda / trackpad: un paso por gesto (la inercia del trackpad no encadena pantallas)
  // (un gesto = eventos seguidos con menos de 180 ms entre sí; los primeros del trackpad son diminutos)
  var lastWheel = 0, gestureUsed = false;
  window.addEventListener('wheel', function(e){
    var now = performance.now();
    if (now - lastWheel > 180) gestureUsed = false;
    lastWheel = now;
    if (target === 3 || gestureUsed || Math.abs(e.deltaY) < 4 || busy()) return;
    gestureUsed = true;
    step(e.deltaY > 0 ? 1 : -1);
  }, {passive:true});
  // táctil (deslizar)
  var x0 = null, y0 = null;
  window.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchend', function(e){
    if (y0 === null) return;
    var dx = x0 - e.changedTouches[0].clientX, dy = y0 - e.changedTouches[0].clientY;
    // solo gestos verticales: arrastrar en horizontal para girar la cabeza no cambia de pantalla
    if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx)) step(dy > 0 ? 1 : -1);
    x0 = y0 = null;
  }, {passive:true});
  // teclado
  window.addEventListener('keydown', function(e){
    if (target === 3) { if (e.key === 'Escape') closeAlbum(); return; }   // en la ficha las flechas hacen scroll del texto
    if (e.key === ' ' && e.target.closest && e.target.closest('button,a')) return;  // espacio activa botones
    if (['ArrowDown','PageDown',' '].indexOf(e.key) > -1) { step(1); e.preventDefault(); }
    if (['ArrowUp','PageUp'].indexOf(e.key) > -1) { step(-1); e.preventDefault(); }
    if (e.key === 'End') { go(2); e.preventDefault(); }
    if (e.key === 'Home') { go(0); e.preventDefault(); }
  });

  if (reduce) document.querySelectorAll('model-viewer').forEach(function(m){ m.removeAttribute('auto-rotate'); });
  go(0); tick();

  /* ---------- IDIOMA ---------- */
  var buttons = document.querySelectorAll('[data-lang]');
  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll('[data-es]').forEach(function(el){ el.textContent = el.getAttribute('data-' + l); });
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false'); });
  }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.lang); }); });
})();
</script>
